name: Temida hourly builder

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Temida builder
        run: python temida_builder.py

      - name: Commit and push temida.txt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add temida.txt
          git diff --staged --quiet || git commit -m "Update temida.txt [skip ci]"
          git push
